<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SpamGuard - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
<div class="login-wrap px-3">
  <div class="text-center mb-4">
    <h2 class="brand">&#128737; SpamGuard</h2>
    <p class="text-muted mb-0">Real-time email spam detection</p>
  </div>

  <div class="card p-4">
    <ul class="nav nav-pills nav-fill mb-3">
      <li class="nav-item"><button class="nav-link active" id="tabLogin" type="button">Login</button></li>
      <li class="nav-item"><button class="nav-link" id="tabRegister" type="button">Register</button></li>
    </ul>

    <div id="msg" class="alert d-none"></div>

    <div class="mb-3">
      <label class="form-label">User ID / Admin ID</label>
      <input id="loginId" class="form-control" autocomplete="username" placeholder="e.g. john01 or ADMIN001">
    </div>
    <div class="mb-3">
      <label class="form-label">Password</label>
      <input id="password" type="password" class="form-control" autocomplete="current-password">
    </div>
    <button id="submitBtn" class="btn btn-primary w-100">Login</button>
    <p class="small text-muted mt-3 mb-0">Same login for everyone. Your ID decides whether you open the user dashboard or the admin panel.</p>
  </div>
</div>

<script src="js/common.js"></script>
<script src="js/login.js"></script>
</body>
</html>
