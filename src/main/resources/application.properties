server.port=${PORT:8080}
server.error.include-message=always

# Local file database (switch to PostgreSQL/MySQL when you move to the cloud)
spring.datasource.url=jdbc:h2:file:./data/spamdb
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

# Default admin account (change the password!)
admin.id=ADMIN001
admin.password=${ADMIN_PASSWORD:Admin@123}

# ML settings
spam.threshold=0.5
# Optional: path to a bigger dataset (same format: label,text). Leave empty to use the built-in sample.
spam.dataset.path=
# How often (ms) the server checks every connected mailbox
spam.poll.interval=30000
